<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — CampusMart</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- CampusMart Global CSS -->
  <link rel="stylesheet" href="/css/main.css" />
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a4078" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d1f3c 0%, #1a4078 50%, #065f46 100%);
      text-align: center;
      padding: 2rem;
    }

    .offline-card {
      background: white;
      border-radius: 24px;
      padding: 3rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      animation: cm-scale-in 0.4s ease;
    }

    .offline-icon {
      font-size: 5rem;
      line-height: 1;
      margin-bottom: 1.5rem;
    }

    .offline-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.75rem;
    }

    .offline-text {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .offline-brand {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a4078;
      margin-bottom: 2rem;
    }

    .offline-brand span { color: #059669; }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <div class="offline-brand">Campus<span>Mart</span></div>
    <h1 class="offline-title">You're Offline</h1>
    <p class="offline-text">
      It looks like you lost your internet connection.
      Check your network and try again — your browsed listings
      may still be available from the cache.
    </p>
    <button onclick="window.location.reload()" class="cm-btn cm-btn--primary cm-btn--full">
      <i class="bi bi-arrow-clockwise"></i>
      Try Again
    </button>
    <button onclick="window.history.back()" class="cm-btn cm-btn--ghost cm-btn--full mt-3">
      <i class="bi bi-arrow-left"></i>
      Go Back
    </button>
  </div>
</body>
</html>
