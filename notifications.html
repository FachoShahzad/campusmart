<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notifications — CampusMart</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/brand.css" />
<meta name="theme-color" content="#14213d" />
<style>
  .n{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid #e5e9ef;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
  .n.unread{background:#f0f8ff;border-color:#b6d4f5}
  .n .ic{font-size:1.4rem;line-height:1.2}
  .dot{width:9px;height:9px;border-radius:50%;background:#dc3545;flex:none;margin-top:6px}
</style>
</head>
<body>
<header class="cm-topbar">
  <a href="/index.html" class="cm-topbar__brand"><div class="cm-topbar__brand-icon">🛒</div><div>Campus<span>Mart</span></div></a>
</header>
<main class="container pb-4" style="padding-top:100px;max-width:680px">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Notifications</h1>
    <button id="all-read" class="btn btn-sm btn-outline-secondary">Mark all as read</button>
  </div>
  <div id="list"><div class="text-center text-muted py-5">Loading...</div></div>
</main>
<script type="module">
  import { auth } from "/js/firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import "/js/app.js";
  import { esc } from "/js/listings.js";
  import { watchNotifications, markRead, markAllRead } from "/js/notifications.js";

  const $ = id => document.getElementById(id);
  const ICONS = { verification: "✅", rating: "⭐", wishlist: "❤️", report: "🛡️", request_match: "🔎", saved_search: "🔖" };
  let uid, items = [];
  const ago = ts => { if (!ts?.toMillis) return ""; const m = Math.floor((Date.now() - ts.toMillis()) / 60000);
    return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.floor(m / 60) + " h ago" : Math.floor(m / 1440) + " d ago"; };

  function render() {
    $("all-read").disabled = !items.some(n => !n.read);
    $("list").innerHTML = items.length ? items.map(n => `<div class="n ${n.read ? "" : "unread"}" data-id="${esc(n.id)}" data-link="${esc(n.link || "")}">
        <div class="ic">${ICONS[n.type] || "🔔"}</div>
        <div class="flex-grow-1"><div class="fw-semibold">${esc(n.title || "Notification")}</div>
          <div class="small">${esc(n.message || "")}</div><div class="small text-muted">${ago(n.createdAt)}</div></div>
        ${n.read ? "" : '<div class="dot"></div>'}</div>`).join("")
      : `<div class="text-center text-muted py-5">No notifications yet.</div>`;
  }
  $("list").addEventListener("click", async e => {
    const el = e.target.closest(".n"); if (!el) return;
    try { await markRead(uid, el.dataset.id); } catch (err) { console.warn(err); }
    if (el.dataset.link) location.href = el.dataset.link;
  });
  $("all-read").addEventListener("click", () => markAllRead(uid, items).catch(e => console.error(e)));

  onAuthStateChanged(auth, user => {
    if (!user) return location.replace("/login.html");
    uid = user.uid;
    watchNotifications(uid, list => { items = list; render(); },
      () => $("list").innerHTML = `<div class="alert alert-danger">Could not load notifications. Check firestore.rules.</div>`);
  });
</script>
</body>
</html>
