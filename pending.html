<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verification Status — CampusMart</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- CampusMart CSS -->
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/brand.css" />
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#14213d" />
</head>
<body class="auth-pending-page">

  <div class="auth-pending-card cm-card">
    <div class="auth-pending-card__icon" id="status-icon">⏳</div>
    <div class="cm-badge-pill cm-badge-pill--warning mb-3" id="status-badge">
      <i class="bi bi-clock-history"></i> Verification Pending
    </div>
    
    <h1 class="auth-pending-card__title" id="status-title">Under Review</h1>
    <p class="auth-pending-card__text" id="status-desc">
      Thank you for registering! Your student verification request has been queued for admin review.
      Once approved, you will have full access to list items, chat, and trade on CampusMart.
    </p>

    <!-- Student details summary -->
    <div class="p-3 bg-light rounded-3 text-start mb-4" id="user-summary" style="display:none;">
      <div class="d-flex justify-content-between mb-1">
        <span class="cm-fs-xs text-muted">Student Name:</span>
        <span class="cm-fs-xs fw-semibold" id="sum-name">-</span>
      </div>
      <div class="d-flex justify-content-between mb-1">
        <span class="cm-fs-xs text-muted">Email:</span>
        <span class="cm-fs-xs fw-semibold" id="sum-email">-</span>
      </div>
      <div class="d-flex justify-content-between">
        <span class="cm-fs-xs text-muted">Dept & Semester:</span>
        <span class="cm-fs-xs fw-semibold" id="sum-dept">-</span>
      </div>
    </div>

    <div class="d-flex flex-column gap-2">
      <button class="cm-btn cm-btn--primary cm-btn--full" id="btn-refresh" onclick="checkStatus()">
        <i class="bi bi-arrow-clockwise"></i> Check Status Now
      </button>
      <button class="cm-btn cm-btn--ghost cm-btn--full" onclick="handleLogout()">
        <i class="bi bi-box-arrow-right"></i> Log Out
      </button>
    </div>
  </div>

  <script type="module">
    import { auth, db, COLLECTIONS } from "/js/firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { showToast } from "/js/app.js";

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.replace("/login.html");
        return;
      }
      currentUser = user;
      await loadProfile(user.uid);
    });

    async function loadProfile(uid) {
      try {
        const snap = await getDoc(doc(db, COLLECTIONS.USERS, uid));
        if (!snap.exists()) {
          window.location.replace("/login.html");
          return;
        }

        const data = snap.data();
        document.getElementById("user-summary").style.display = "block";
        document.getElementById("sum-name").textContent = data.name || "Student";
        document.getElementById("sum-email").textContent = data.email || currentUser.email;
        document.getElementById("sum-dept").textContent = `${data.department || "UAJK"} (Sem ${data.semester || "-"})`;

        if (data.verificationStatus === "blocked") {
          document.getElementById("status-icon").textContent = "🚫";
          document.getElementById("status-badge").className = "cm-badge-pill cm-badge-pill--danger mb-3";
          document.getElementById("status-badge").innerHTML = `<i class="bi bi-slash-circle-fill"></i> Account Blocked`;
          document.getElementById("status-title").textContent = "Account Blocked";
          document.getElementById("status-desc").textContent = "An admin has blocked your account because of a policy violation. You can still log in, but you cannot post items, chat or trade. Please contact support if you think this is a mistake.";
        } else if (data.verificationStatus === "verified") {
          document.getElementById("status-icon").textContent = "🎉";
          document.getElementById("status-badge").className = "cm-badge-pill cm-badge-pill--success mb-3";
          document.getElementById("status-badge").innerHTML = `<i class="bi bi-check-circle-fill"></i> Verified Student`;
          document.getElementById("status-title").textContent = "Account Verified!";
          document.getElementById("status-desc").textContent = "Your account is verified! You can now start using CampusMart.";
          const btn = document.getElementById("btn-refresh");
          btn.innerHTML = `<i class="bi bi-shop"></i> Go to Marketplace`;
          btn.onclick = () => window.location.replace("/index.html");
        } else if (data.verificationStatus === "rejected") {
          document.getElementById("status-icon").textContent = "❌";
          document.getElementById("status-badge").className = "cm-badge-pill cm-badge-pill--danger mb-3";
          document.getElementById("status-badge").innerHTML = `<i class="bi bi-x-circle-fill"></i> Verification Rejected`;
          document.getElementById("status-title").textContent = "Verification Rejected";
          document.getElementById("status-desc").textContent = "Unfortunately, your student ID could not be verified by the admin. Please contact support or re-register with a clear photo of your student card.";
        }
      } catch (err) {
        console.error("Error loading verification profile:", err);
      }
    }

    window.checkStatus = async () => {
      if (!currentUser) return;
      showToast("Checking verification status...", "info");
      await loadProfile(currentUser.uid);
    };

    window.handleLogout = async () => {
      await signOut(auth);
      window.location.replace("/login.html");
    };
  </script>
</body>
</html>
