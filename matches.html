<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Semester Book Match — CampusMart</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="/css/main.css" />
<link rel="stylesheet" href="/css/brand.css" />
<meta name="theme-color" content="#14213d" />
<style>
  .g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:992px){.g{grid-template-columns:repeat(4,1fr)}}
  .c{display:block;color:inherit;text-decoration:none;border:1px solid #e5e9ef;border-radius:12px;overflow:hidden;background:#fff}
  .c img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f1f3f5}
  .c div{padding:8px 10px}
</style>
</head>
<body>
<header class="cm-topbar">
  <a href="/index.html" class="cm-topbar__brand"><div class="cm-topbar__brand-icon">🛒</div><div>Campus<span>Mart</span></div></a>
</header>
<main class="container pb-4" style="padding-top:100px;">
  <h1 class="h4">Semester Book Match</h1>
  <p class="text-muted small" id="sub">Books and notes for your department and semester.</p>
  <div class="row g-2 mb-3" style="max-width:520px">
    <div class="col-7"><input id="dept" class="form-control form-control-sm" placeholder="Department" /></div>
    <div class="col-5"><select id="sem" class="form-select form-select-sm"></select></div>
  </div>
  <div id="out"><div class="text-center text-muted py-5">Loading...</div></div>
</main>
<script type="module">
  import { auth, db } from "/js/firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { doc, getDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import "/js/app.js";
  import { priceLabel, esc } from "/js/listings.js";
  import { DEMAND_CATEGORIES } from "/js/campus.js";

  const $ = id => document.getElementById(id);
  let all = [];
  $("sem").innerHTML = [1,2,3,4,5,6,7,8].map(n => `<option value="${n}">Semester ${n}</option>`).join("");
  const card = l => `<a class="c" href="/listing.html?id=${encodeURIComponent(l.id)}"><img loading="lazy" src="${l.photos?.[0] || ""}" alt="${esc(l.title)}">
    <div><div class="fw-semibold small">${esc(l.title)}</div><div class="small text-success fw-semibold">${priceLabel(l)}</div>
    <div class="small text-muted">${esc(l.department || "")} · Sem ${esc(l.semester || "-")}</div></div></a>`;
  const sameDept = (a, b) => { a = (a || "").toLowerCase().trim(); b = (b || "").toLowerCase().trim(); return !!a && !!b && (a.includes(b) || b.includes(a)); };

  function render() {
    const dept = $("dept").value, sem = $("sem").value;
    const pool = all.filter(l => l.status === "available" && DEMAND_CATEGORIES.includes(l.category));
    const exact = pool.filter(l => sameDept(l.department, dept) && String(l.semester) === sem);
    const other = pool.filter(l => sameDept(l.department, dept) && String(l.semester) !== sem);
    $("out").innerHTML =
      `<h2 class="h6">Matches for Semester ${esc(sem)}</h2>` +
      (exact.length ? `<div class="g mb-4">${exact.map(card).join("")}</div>` : `<div class="text-muted small mb-4">No exact matches yet. Try the Request Board to ask for what you need.</div>`) +
      (other.length ? `<h2 class="h6">Same department, other semesters</h2><div class="g">${other.map(card).join("")}</div>` : "");
  }
  $("dept").addEventListener("input", render); $("sem").addEventListener("change", render);

  onAuthStateChanged(auth, async user => {
    if (!user) return location.replace("/login.html");
    const p = (await getDoc(doc(db, "users", user.uid))).data() || {};
    $("dept").value = p.department || ""; if (p.semester) $("sem").value = String(p.semester);
    try {
      const snap = await getDocs(query(collection(db, "listings"), orderBy("createdAt", "desc"), limit(100)));
      all = snap.docs.map(d => ({ id: d.id, ...d.data() })); render();
    } catch (e) { console.error(e); $("out").innerHTML = `<div class="alert alert-danger">Could not load listings.</div>`; }
  });
</script>
</body>
</html>
